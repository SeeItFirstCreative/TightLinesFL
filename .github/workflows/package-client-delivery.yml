name: Build TightLinesFL client delivery

on:
  push:
    branches:
      - client-delivery-package
    paths:
      - .github/workflows/package-client-delivery.yml
      - package_client_delivery_optimized.py
      - package_client_delivery.py
      - validate_delivery.py

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging and browser validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow playwright
          python -m playwright install --with-deps chromium

      - name: Build optimized delivery ZIP
        run: python package_client_delivery_optimized.py

      - name: Validate extracted themes in Chromium
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('validate_delivery.py')
          s=p.read_text()
          s=s.replace("a[href^=\"#\"]:not([href=\"#\"])", "a[href^=\"#\"]:not([href=\"#\"]):visible")
          p.write_text(s)
          PY
          python validate_delivery.py

      - name: Upload validated client package
        uses: actions/upload-artifact@v4
        with:
          name: tightlinesfl-client-delivery
          path: |
            delivery-build/TightLinesFL-Client-Presentation.zip
            delivery-build/validation-report.json
            delivery-build/browser-validation.json
          if-no-files-found: error
          retention-days: 7
